<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarPlayer Pro - Audio & Radio HD Engine</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .custom-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }
    .vertical-slider {
      -webkit-appearance: slider-vertical;
      appearance: slider-vertical;
      writing-mode: bt-lr;
    }
    #playlist-container {
      will-change: scroll-position;
      contain: content;
    }
    .playlist-item {
      contain: layout style;
    }
  </style>
</head>
<body class="bg-black text-slate-100 h-screen w-screen overflow-hidden flex flex-col font-sans antialiased select-none relative">

  <!-- PANTALLA DE DESPEDIDA "GOODBYE" -->
  <div id="goodbye-screen" class="fixed inset-0 bg-black z-50 flex flex-col items-center justify-center hidden transition-opacity duration-500 opacity-0">
    <div class="text-center p-6 bg-zinc-950 border border-zinc-800 rounded-3xl shadow-2xl max-w-xs w-full mx-4 flex flex-col items-center gap-3">
      <div class="w-full max-w-[200px] shrink-0">
        <img src="https://raw.githubusercontent.com/juanrtrt55-design/index.html/refs/heads/main/adios.jpg" alt="Goodbye" class="w-full h-auto object-contain rounded-xl">
      </div>
      <h1 class="text-3xl font-extrabold tracking-wider text-white mt-1">Goodbye</h1>
      <p class="text-xs text-purple-400 font-semibold">Saliendo de la aplicación...</p>
    </div>
  </div>

  <!-- CONTENEDOR PRINCIPAL FIJO PANTALLA COMPLETA -->
  <div class="max-w-xl w-full mx-auto h-full p-3 flex flex-col gap-2.5 overflow-hidden bg-black">

    <!-- 1. REPRODUCTOR COMPACTO Y ESTÁTICO (ARRIBA) -->
    <header class="bg-zinc-950 border border-zinc-800 rounded-2xl p-3 shadow-xl overflow-hidden shrink-0 relative">
      <div class="flex flex-col gap-2 relative z-10">
        
        <div class="flex items-center justify-between gap-2">
          <!-- BUSCADOR CON LUPA A LA IZQUIERDA -->
          <div class="relative flex items-center shrink-0">
            <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400 absolute left-2 pointer-events-none"></i>
            <input type="text" id="search-input" placeholder="Buscar..." class="bg-zinc-900 border border-zinc-800 rounded-full text-xs text-white pl-7 pr-2.5 py-0.5 w-28 md:w-36 focus:outline-none focus:border-purple-500 transition">
          </div>
          
          <div class="flex items-center gap-2 overflow-x-auto custom-scroll">
            <!-- BOTÓN 8D -->
            <button id="btn-8d" class="text-[10px] px-2.5 py-0.5 rounded-full bg-zinc-900 text-slate-300 font-bold border border-zinc-800 hover:border-purple-500 hover:text-purple-400 transition flex items-center gap-1 shrink-0">
              <i data-lucide="headphones" class="w-3 h-3"></i> <span>8D: OFF</span>
            </button>

            <!-- BOTÓN MONO / STEREO -->
            <button id="btn-mono" class="text-[10px] px-2.5 py-0.5 rounded-full bg-zinc-900 text-slate-300 font-bold border border-zinc-800 hover:border-purple-500 hover:text-purple-400 transition flex items-center gap-1 shrink-0">
              <i data-lucide="disc" class="w-3 h-3"></i> <span>Audio: Stereo</span>
            </button>

            <span id="playing-badge" class="bg-emerald-600 text-white text-[10px] px-2 py-0.5 rounded-full font-medium flex items-center gap-1 opacity-0 transition-opacity pointer-events-none shrink-0">
              <span class="w-1.5 h-1.5 bg-white rounded-full animate-pulse"></span> Reproduciendo
            </span>
          </div>
        </div>

        <!-- CONTENEDOR DE MEDIOS CON SLIDERS VERTICALES Y CONTROLES -->
        <div class="flex items-center gap-2 w-full">
          
          <!-- SLIDER BAJO PROFUNDO (IZQUIERDA - VERTICAL) -->
          <div class="flex flex-col items-center gap-1 shrink-0 bg-black/80 p-1.5 rounded-xl border border-zinc-800">
            <span class="text-[9px] font-semibold text-purple-400">Bajo</span>
            <input type="range" id="bass-slider" min="0" max="29" value="29" class="vertical-slider h-28 w-4 bg-zinc-900 rounded-lg cursor-pointer accent-purple-500">
          </div>

          <!-- CONTENEDOR ÚNICO DE MEDIOS CON TÍTULO CENTRADO Y CONTROLES -->
          <div id="media-display-container" class="w-full relative rounded-xl overflow-hidden bg-black flex flex-col flex-1 border border-zinc-800">
            
            <!-- PANTALLA DE VIDEO -->
            <div id="video-wrapper" style="display: none;" class="w-full h-32 rounded-xl overflow-hidden bg-black relative">
              <video id="video-player" crossorigin="anonymous" playsinline class="w-full h-full object-cover"></video>
            </div>

            <!-- TÍTULO Y CONTROLES GRANDES EN EL MEDIO -->
            <div id="center-controls" class="w-full h-32 mx-auto rounded-xl bg-zinc-900 shadow-lg flex flex-col justify-center items-center p-2.5 relative gap-2">
              
              <div class="text-center w-full px-2">
                <h1 id="track-title" class="text-xs md:text-sm font-bold tracking-tight text-white leading-tight break-words max-h-9 overflow-y-auto custom-scroll">Selecciona un archivo o radio</h1>
                <p id="track-artist" class="text-slate-400 text-[10px] font-medium mt-0.5 truncate">Motor HD Activo</p>
              </div>

              <div class="flex items-center justify-center gap-4">
                <button id="btn-center-prev" class="p-2.5 rounded-full bg-zinc-800 hover:bg-zinc-700 text-slate-200 hover:text-white transition shadow-md">
                  <i data-lucide="skip-back" class="w-5 h-5"></i>
                </button>
                <button id="btn-center-play" class="p-3 rounded-full bg-purple-600 hover:bg-purple-500 text-white shadow-lg shadow-purple-600/50 transition transform active:scale-95">
                  <i data-lucide="play" id="center-play-icon" class="w-7 h-7 fill-current"></i>
                </button>
                <button id="btn-center-next" class="p-2.5 rounded-full bg-zinc-800 hover:bg-zinc-700 text-slate-200 hover:text-white transition shadow-md">
                  <i data-lucide="skip-forward" class="w-5 h-5"></i>
                </button>
              </div>

            </div>

          </div>

          <!-- SLIDER TWISTER (DERECHA - VERTICAL) -->
          <div class="flex flex-col items-center gap-1 shrink-0 bg-black/80 p-1.5 rounded-xl border border-zinc-800">
            <span class="text-[9px] font-semibold text-indigo-400">Twister</span>
            <input type="range" id="tweeter-slider" min="0" max="29" value="12" class="vertical-slider h-28 w-4 bg-zinc-900 rounded-lg cursor-pointer accent-indigo-500">
          </div>

        </div>

        <!-- Volumen y Barra de Progreso -->
        <div class="w-full flex flex-col justify-between gap-1 mt-0.5">
          <div class="flex justify-between items-center">
            <span id="stream-status-text" class="text-[10px] text-purple-400 font-mono truncate max-w-[250px]">Listo</span>
            <div class="flex items-center gap-1.5 shrink-0">
              <i data-lucide="volume-2" class="w-3.5 h-3.5 text-slate-400"></i>
              <input type="range" id="volume-bar" value="80" min="0" max="100" class="w-16 h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer accent-purple-500">
            </div>
          </div>

          <!-- Barra de Progreso -->
          <div class="space-y-0.5">
            <input type="range" id="progress-bar" value="0" min="0" max="100" class="w-full h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer accent-purple-500">
            <div class="flex justify-between text-[10px] text-slate-400 font-mono">
              <span id="current-time">0:00</span>
              <span id="total-duration">En vivo / 0:00</span>
            </div>
          </div>
        </div>

        <!-- BARRA DE PESTAÑAS (LOCAL vs RADIOS EN LÍNEA) -->
        <div class="flex items-center gap-2 pt-1 border-t border-zinc-900 overflow-x-auto custom-scroll pb-1">
          <button id="tab-local" class="text-[10px] px-3 py-1 rounded-lg bg-purple-600 text-white font-bold shrink-0 transition shadow-sm flex items-center gap-1">
            <i data-lucide="folder-music" class="w-3.5 h-3.5"></i> Reproductor Local
          </button>
          <button id="tab-radios" class="text-[10px] px-3 py-1 rounded-lg bg-zinc-900 hover:bg-zinc-800 text-slate-300 border border-zinc-800 font-bold shrink-0 transition flex items-center gap-1">
            <i data-lucide="radio" class="w-3.5 h-3.5 text-emerald-400"></i> Radios en Línea
          </button>
          
          <div class="ml-auto flex items-center gap-1.5 shrink-0" id="local-extra-controls">
            <button id="filter-all" class="text-[10px] px-2.5 py-1 rounded-lg bg-purple-600 text-white font-bold shrink-0 transition shadow-sm">
              Todos
            </button>
            <div id="genre-filters-container" class="flex items-center gap-1.5 shrink-0"></div>
            <button id="btn-shuffle" title="Reproducción Aleatoria" class="p-1.5 rounded-lg bg-zinc-900 hover:bg-zinc-800 text-slate-300 border border-zinc-800 transition text-[10px] flex items-center gap-1">
              <i data-lucide="shuffle" class="w-3.5 h-3.5"></i>
            </button>
            <button id="btn-repeat" title="Repetir Canción" class="p-1.5 rounded-lg bg-zinc-900 hover:bg-zinc-800 text-slate-300 border border-zinc-800 transition text-[10px] flex items-center gap-1">
              <i data-lucide="repeat" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        </div>

      </div>
    </header>

    <!-- 2. LISTA DE ARCHIVOS / RADIOS -->
    <main class="bg-zinc-950 border border-zinc-800/80 rounded-2xl p-3 flex flex-col flex-1 min-h-0 overflow-hidden">
      <div class="flex items-center justify-between mb-2 px-1 shrink-0">
        <h2 id="list-title" class="text-xs font-bold text-slate-200 flex items-center gap-1.5">
          <i data-lucide="list-music" class="w-3.5 h-3.5 text-purple-400"></i> Lista de Archivos Locales
        </h2>
        <span id="playlist-count" class="text-[10px] text-slate-400 font-medium">0 archivos</span>
      </div>

      <div id="playlist-container" class="custom-scroll space-y-1.5 overflow-y-auto flex-1 pr-1">
      </div>
    </main>

    <!-- 3. BARRA INFERIOR FIJA -->
    <footer class="bg-zinc-950 border border-zinc-800 py-2.5 px-3.5 rounded-2xl shrink-0 flex items-center justify-between">
      <span class="text-[10px] text-slate-400 font-medium">LG Audio HD Engine</span>

      <div class="flex items-center gap-2">
        <!-- Importar Archivos (AMARILLO) -->
        <div>
          <input type="file" id="file-input" accept="audio/*,video/*,.mp3,.wav,.wma,.m4a,.aac,.ogg,.flac,.mp4,.mkv,.webm,.mov" multiple class="hidden">
          <button onclick="document.getElementById('file-input').click()" class="flex items-center gap-1.5 bg-yellow-400 hover:bg-yellow-300 active:bg-yellow-500 text-zinc-950 font-bold text-xs px-3.5 py-1.5 rounded-lg shadow-md transition duration-200">
            <i data-lucide="folder-plus" class="w-3.5 h-3.5 stroke-[2.5]"></i>
            <span>Importar</span>
          </button>
        </div>

        <!-- Botón de Salir (ROJO) -->
        <button id="btn-exit" class="flex items-center gap-1.5 bg-red-600 hover:bg-red-500 active:bg-red-700 text-white font-bold text-xs px-3.5 py-1.5 rounded-lg shadow-md shadow-red-600/30 transition duration-200">
          <i data-lucide="power" class="w-3.5 h-3.5 stroke-[2.5]"></i>
          <span>Salir</span>
        </button>
      </div>
    </footer>

  </div>

  <audio id="audio-player" crossorigin="anonymous" playsinline preload="auto"></audio>

  <!-- Soporte HLS para streams .m3u8 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    lucide.createIcons();

    // ==========================================
    // LISTAS DE REPRODUCCIÓN (LOCAL & JSON DINÁMICO)
    // ==========================================
    let localPlaylist = [];
    let radiosPlaylist = [];

    // Cargar radios desde el JSON externo
    async function loadRadiosJson() {
      try {
        const response = await fetch('https://raw.githubusercontent.com/pitufoardiente000/Radio/refs/heads/main/radios.json');
        const data = await response.json();
        const rawList = Array.isArray(data) ? data : (data.radios || data.channels || []);
        
        radiosPlaylist = rawList.map((r, idx) => ({
          id: r.id || 'r_' + idx,
          title: r.title || r.name || r.station || `Radio ${idx + 1}`,
          artist: r.artist || r.descripcion || 'Radio en Vivo',
          genre: r.genre || r.categoria || r.category || 'Online',
          type: 'audio',
          urls: r.urls ? r.urls : (r.url ? [r.url] : (r.stream ? [r.stream] : []))
        }));

        if (currentMode === 'radios') {
          renderPlaylist();
        }
      } catch (err) {
        console.error("Error al cargar el JSON de radios:", err);
      }
    }

    let currentMode = 'local'; // 'local' o 'radios'
    let currentTrackIndex = -1;
    let activeTrackId = null;
    let currentUrlIndex = 0; // Para failover de radios
    let isPlaying = false;
    let is8DActive = false;
    let isMonoActive = false;
    let isShuffleActive = false;
    let isRepeatActive = false;
    let currentGenreFilter = 'all';
    let searchQuery = '';
    let wakeLock = null;
    let hlsInstance = null;

    const audio = document.getElementById('audio-player');
    const video = document.getElementById('video-player');
    const videoWrapper = document.getElementById('video-wrapper');
    const centerControls = document.getElementById('center-controls');

    const btnPlay = document.getElementById('btn-center-play');
    const playIcon = document.getElementById('center-play-icon');
    const btnPrev = document.getElementById('btn-center-prev');
    const btnNext = document.getElementById('btn-center-next');
    const btn8D = document.getElementById('btn-8d');
    const btnMono = document.getElementById('btn-mono');
    const btnShuffle = document.getElementById('btn-shuffle');
    const btnRepeat = document.getElementById('btn-repeat');
    const filterAllBtn = document.getElementById('filter-all');
    const genreFiltersContainer = document.getElementById('genre-filters-container');
    const searchInput = document.getElementById('search-input');
    const btnExit = document.getElementById('btn-exit');
    const goodbyeScreen = document.getElementById('goodbye-screen');
    const localExtraControls = document.getElementById('local-extra-controls');

    const tabLocal = document.getElementById('tab-local');
    const tabRadios = document.getElementById('tab-radios');
    const listTitle = document.getElementById('list-title');
    const streamStatusText = document.getElementById('stream-status-text');

    const progressBar = document.getElementById('progress-bar');
    const volumeBar = document.getElementById('volume-bar');
    const currentTimeEl = document.getElementById('current-time');
    const totalDurationEl = document.getElementById('total-duration');
    const trackTitle = document.getElementById('track-title');
    const trackArtist = document.getElementById('track-artist');
    const trackGenre = document.getElementById('track-genre');
    const playingBadge = document.getElementById('playing-badge');
    const playlistContainer = document.getElementById('playlist-container');
    const playlistCount = document.getElementById('playlist-count');
    const fileInput = document.getElementById('file-input');

    const bassSlider = document.getElementById('bass-slider');
    const tweeterSlider = document.getElementById('tweeter-slider');

    // Obtener lista activa según la pestaña
    function getActivePlaylist() {
      return currentMode === 'local' ? localPlaylist : radiosPlaylist;
    }

    // ==========================================
    // CAMBIO DE PESTAÑAS (LOCAL vs RADIOS)
    // ==========================================
    tabLocal.addEventListener('click', () => {
      currentMode = 'local';
      tabLocal.className = "text-[10px] px-3 py-1 rounded-lg bg-purple-600 text-white font-bold shrink-0 transition shadow-sm flex items-center gap-1";
      tabRadios.className = "text-[10px] px-3 py-1 rounded-lg bg-zinc-900 hover:bg-zinc-800 text-slate-300 border border-zinc-800 font-bold shrink-0 transition flex items-center gap-1";
      localExtraControls.style.display = 'flex';
      listTitle.innerHTML = `<i data-lucide="list-music" class="w-3.5 h-3.5 text-purple-400"></i> Lista de Archivos Locales`;
      currentGenreFilter = 'all';
      updateGenreFilterUI();
      renderPlaylist();
      lucide.createIcons();
    });

    tabRadios.addEventListener('click', () => {
      currentMode = 'radios';
      tabRadios.className = "text-[10px] px-3 py-1 rounded-lg bg-emerald-600 text-white font-bold shrink-0 transition shadow-sm flex items-center gap-1";
      tabLocal.className = "text-[10px] px-3 py-1 rounded-lg bg-zinc-900 hover:bg-zinc-800 text-slate-300 border border-zinc-800 font-bold shrink-0 transition flex items-center gap-1";
      localExtraControls.style.display = 'none';
      listTitle.innerHTML = `<i data-lucide="radio" class="w-3.5 h-3.5 text-emerald-400"></i> Radios en Línea `;
      searchQuery = '';
      searchInput.value = '';
      renderPlaylist();
      lucide.createIcons();
    });

    // ==========================================
    // SALIDA DE LA APP "GOODBYE"
    // ==========================================
    btnExit.addEventListener('click', () => {
      pauseTrack();
      if (audioCtx) audioCtx.close();

      goodbyeScreen.classList.remove('hidden');
      setTimeout(() => {
        goodbyeScreen.classList.remove('opacity-0');
        goodbyeScreen.classList.add('opacity-100');
      }, 10);

      setTimeout(() => {
        window.close();
        document.body.innerHTML = `
          <div class="h-screen w-screen bg-black flex flex-col items-center justify-center p-4">
            <div class="text-center p-6 bg-zinc-950 border border-zinc-800 rounded-3xl shadow-2xl max-w-xs w-full flex flex-col items-center gap-3">
              <div class="w-full max-w-[200px] shrink-0">
                <img src="https://raw.githubusercontent.com/juanrtrt55-design/index.html/refs/heads/main/adios.jpg" alt="Goodbye" class="w-full h-auto object-contain rounded-xl">
              </div>
              <h1 class="text-3xl font-extrabold tracking-wider text-white mt-1">Goodbye</h1>
              <p class="text-xs text-purple-400 font-semibold">Saliendo de la aplicación...</p>
            </div>
          </div>
        `;
      }, 2000);
    });

    // ==========================================
    // FILTROS Y BÚSQUEDA
    // ==========================================
    filterAllBtn.addEventListener('click', () => {
      currentGenreFilter = 'all';
      updateGenreFilterUI();
      renderPlaylist();
    });

    btnShuffle.addEventListener('click', () => {
      isShuffleActive = !isShuffleActive;
      btnShuffle.className = isShuffleActive 
        ? "p-1.5 rounded-lg bg-purple-600 text-white font-bold transition text-[10px] flex items-center gap-1 shadow-sm"
        : "p-1.5 rounded-lg bg-zinc-900 hover:bg-zinc-800 text-slate-300 border border-zinc-800 transition text-[10px] flex items-center gap-1";
    });

    btnRepeat.addEventListener('click', () => {
      isRepeatActive = !isRepeatActive;
      btnRepeat.className = isRepeatActive 
        ? "p-1.5 rounded-lg bg-purple-600 text-white font-bold transition text-[10px] flex items-center gap-1 shadow-sm"
        : "p-1.5 rounded-lg bg-zinc-900 hover:bg-zinc-800 text-slate-300 border border-zinc-800 transition text-[10px] flex items-center gap-1";
    });

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      renderPlaylist();
    });

    function getFilteredPlaylist() {
      const list = getActivePlaylist();
      if (currentMode === 'radios') {
        return list.filter(track => searchQuery === '' || track.title.toLowerCase().includes(searchQuery) || track.genre.toLowerCase().includes(searchQuery));
      }
      return list.filter(track => {
        const matchesGenre = currentGenreFilter === 'all' || track.genre.toLowerCase() === currentGenreFilter.toLowerCase();
        const matchesSearch = searchQuery === '' || track.title.toLowerCase().includes(searchQuery) || track.artist.toLowerCase().includes(searchQuery);
        return matchesGenre && matchesSearch;
      });
    }

    function updateGenreFilterUI() {
      if (currentMode !== 'local') return;
      filterAllBtn.className = currentGenreFilter === 'all' 
        ? "text-[10px] px-2.5 py-1 rounded-lg bg-purple-600 text-white font-bold shrink-0 transition shadow-sm"
        : "text-[10px] px-2.5 py-1 rounded-lg bg-zinc-900 hover:bg-zinc-800 text-slate-300 border border-zinc-800 shrink-0 transition";

      genreFiltersContainer.innerHTML = '';
      const uniqueGenres = [...new Set(localPlaylist.map(t => t.genre))];

      uniqueGenres.forEach(genre => {
        const isActive = currentGenreFilter.toLowerCase() === genre.toLowerCase();
        const btn = document.createElement('button');
        btn.className = `text-[10px] px-2.5 py-1 rounded-lg shrink-0 transition font-semibold ${
          isActive ? 'bg-purple-600 text-white shadow-sm' : 'bg-zinc-900 hover:bg-zinc-800 text-slate-300 border border-zinc-800'
        }`;
        btn.textContent = genre;
        btn.addEventListener('click', () => {
          currentGenreFilter = genre;
          updateGenreFilterUI();
          renderPlaylist();
        });
        genreFiltersContainer.appendChild(btn);
      });
    }

    // ==========================================
    // SISTEMA EN SEGUNDO PLANO
    // ==========================================
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen');
      } catch (err) {}
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release().then(() => { wakeLock = null; });
      }
    }

    let silentKeepAliveCtx = null;
    function startBackgroundKeepAlive() {
      if (!silentKeepAliveCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        silentKeepAliveCtx = new AudioCtx();
        const osc = silentKeepAliveCtx.createOscillator();
        const gain = silentKeepAliveCtx.createGain();
        osc.frequency.value = 15;
        gain.gain.value = 0.0001;
        osc.connect(gain);
        gain.connect(silentKeepAliveCtx.destination);
        osc.start();
      }
      if (silentKeepAliveCtx.state === 'suspended') silentKeepAliveCtx.resume();
    }

    function setupMediaSession(track) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: track.title,
          artist: track.artist || 'Radio en Vivo',
          album: currentMode === 'local' ? 'CarPlayer Pro HD' : 'Radios JSON HD',
          artwork: [{ src: 'https://raw.githubusercontent.com/juanrtrt55-design/index.html/refs/heads/main/adios.jpg', sizes: '512x512', type: 'image/jpeg' }]
        });
        navigator.mediaSession.setActionHandler('play', () => playTrack());
        navigator.mediaSession.setActionHandler('pause', () => pauseTrack());
        navigator.mediaSession.setActionHandler('previoustrack', () => btnPrev.click());
        navigator.mediaSession.setActionHandler('nexttrack', () => btnNext.click());
      }
    }

    // ==========================================
    // MOTOR DE AUDIO (BAJO PROFUNDO NÍTIDO, TWISTER, MONO/STEREO & 8D)
    // ==========================================
    let audioCtx = null;
    let currentBass = parseFloat(bassSlider.value);
    let currentTweeter = parseFloat(tweeterSlider.value);
    let pannerAngle = 0;

    const processed = new WeakSet();
    const engines = [];

    function getAudioContext() {
      if (!audioCtx) {
        const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioCtxClass({ latencyHint: 'playback' });
      }
      return audioCtx;
    }

    function attach(mediaEl) {
      if (!mediaEl || processed.has(mediaEl)) return;
      if (mediaEl.tagName !== 'VIDEO' && mediaEl.tagName !== 'AUDIO') return;

      try {
        const ctx = getAudioContext();
        const source = ctx.createMediaElementSource(mediaEl);
        const analyzer = ctx.createAnalyser();
        analyzer.fftSize = 512;

        const masterInput = ctx.createGain();
        masterInput.gain.value = 0.35;

        // CANAL 1: BAJO PROFUNDO PARALELO (NÍTIDO Y LIMPIO)
        const bassSplitter = ctx.createGain();
        bassSplitter.gain.value = 1.0;

        const subsonicFilter = ctx.createBiquadFilter();
        subsonicFilter.type = 'highpass';
        subsonicFilter.frequency.value = 5; 
        subsonicFilter.Q.value = 1.1;

        const bassLowpass = ctx.createBiquadFilter();
        bassLowpass.type = 'lowpass';
        bassLowpass.frequency.value = 20; 
        bassLowpass.Q.value = 1.1;

        const subEngine = ctx.createBiquadFilter();
        subEngine.type = 'lowshelf';
        subEngine.frequency.value = 100;
        subEngine.gain.value = 0;

        const deepEngine = ctx.createBiquadFilter();
        deepEngine.type = 'peaking';
        deepEngine.frequency.value = 43;
        deepEngine.Q.value = 1.1;
        deepEngine.gain.value = 0;

        const bassCompressor = ctx.createDynamicsCompressor();
        bassCompressor.threshold.value = -18.0; 
        bassCompressor.knee.value = 16.0;       
        bassCompressor.ratio.value = 16.0;      
        bassCompressor.attack.value = 0.001;    
        bassCompressor.release.value = 0.3;

        const thermalGuard = ctx.createBiquadFilter();
        thermalGuard.type = 'peaking';
        thermalGuard.frequency.value = 75;
        thermalGuard.Q.value = 0.7;
        thermalGuard.gain.value = -3.0; 

        const bassOutput = ctx.createGain();
        bassOutput.gain.value = 1.0;

        // CANAL 2: VOZ Y CLARIDAD
        const mainSplitter = ctx.createGain();
        mainSplitter.gain.value = 1.0;

        const clarity = ctx.createBiquadFilter();
        clarity.type = 'peaking';
        clarity.frequency.value = 2800;
        clarity.gain.value = 10;

        const air = ctx.createBiquadFilter();
        air.type = 'highshelf';
        air.frequency.value = 12000;
        air.gain.value = 8;

        const mainOutput = ctx.createGain();
        mainOutput.gain.value = 1.1;

        // MASTER SUM & TWISTER (TWEETER)
        const masterSum = ctx.createGain();
        masterSum.gain.value = 1.0;

        const tweeterNode = ctx.createBiquadFilter();
        tweeterNode.type = 'highshelf';
        tweeterNode.frequency.value = 10000;
        tweeterNode.gain.value = 0;

        const dolbyNode = ctx.createBiquadFilter();
        dolbyNode.type = 'peaking';
        dolbyNode.frequency.value = 6000;
        dolbyNode.Q.value = 1.0;
        dolbyNode.gain.value = 0;

        // Nodo Mono / Stereo
        const monoNode = ctx.createGain();
        monoNode.channelCount = isMonoActive ? 1 : 2;
        monoNode.channelCountMode = 'explicit';
        monoNode.channelInterpretation = 'speakers';

        // Nodo Estéreo para 8D
        let sPanner = null;
        if (ctx.createStereoPanner) {
          sPanner = ctx.createStereoPanner();
          sPanner.pan.value = 0;
        }

        const limiter = ctx.createDynamicsCompressor();
        limiter.threshold.value = -14.0; 
        limiter.ratio.value = 20;

        // Enrutamiento
        source.connect(masterInput);

        masterInput.connect(bassSplitter);
        bassSplitter.connect(subsonicFilter);
        subsonicFilter.connect(bassLowpass);
        bassLowpass.connect(subEngine);
        subEngine.connect(deepEngine);
        deepEngine.connect(bassCompressor);
        bassCompressor.connect(thermalGuard);
        thermalGuard.connect(bassOutput);
        bassOutput.connect(masterSum);

        masterInput.connect(mainSplitter);
        mainSplitter.connect(clarity);
        clarity.connect(air);
        air.connect(mainOutput);
        mainOutput.connect(masterSum);

        masterSum.connect(tweeterNode);
        tweeterNode.connect(dolbyNode);
        dolbyNode.connect(monoNode);

        if (sPanner) {
          monoNode.connect(sPanner);
          sPanner.connect(limiter);
        } else {
          monoNode.connect(limiter);
        }

        limiter.connect(analyzer);
        analyzer.connect(ctx.destination);

        processed.add(mediaEl);
        const engine = {
          mediaEl, analyzer, masterInput, subEngine, deepEngine, tweeterNode, dolbyNode, monoNode, sPanner, limiter,
          lastBeatTime: 0, beatThreshold: 0
        };
        engines.push(engine);

        applyBass(engine, currentBass);
        applyTweeter(engine, currentTweeter);

      } catch (err) {
        console.warn('[Audio Engine] Error:', err.message);
      }
    }

    function applyBass(engine, v) {
      if (!audioCtx) return;
      engine.deepEngine.gain.setTargetAtTime(v * 1.2, audioCtx.currentTime, 0.25);
      engine.subEngine.gain.setTargetAtTime(v * 0.9, audioCtx.currentTime, 0.25);
      const vol = 0.35 - v * 0.0055;
      engine.masterInput.gain.setTargetAtTime(Math.max(vol, 0.08), audioCtx.currentTime, 0.25);
    }

    function applyTweeter(engine, v) {
      if (!audioCtx) return;
      engine.tweeterNode.gain.setTargetAtTime(v * 1.2, audioCtx.currentTime, 0.1);
    }

    bassSlider.addEventListener('input', (e) => {
      currentBass = parseFloat(e.target.value);
      engines.forEach(engine => applyBass(engine, currentBass));
    });

    tweeterSlider.addEventListener('input', (e) => {
      currentTweeter = parseFloat(e.target.value);
      engines.forEach(engine => applyTweeter(engine, currentTweeter));
    });

    btn8D.addEventListener('click', () => {
      is8DActive = !is8DActive;
      btn8D.className = is8DActive 
        ? "text-[10px] px-2.5 py-0.5 rounded-full bg-purple-600 text-white font-bold border border-purple-500 shadow-md shadow-purple-600/40 transition flex items-center gap-1 shrink-0"
        : "text-[10px] px-2.5 py-0.5 rounded-full bg-zinc-900 text-slate-300 font-bold border border-zinc-800 hover:border-purple-500 hover:text-purple-400 transition flex items-center gap-1 shrink-0";
      btn8D.innerHTML = `<i data-lucide="headphones" class="w-3 h-3"></i> <span>8D: ${is8DActive ? 'ON' : 'OFF'}</span>`;
      if (!is8DActive) {
        engines.forEach(e => { if (e.sPanner && audioCtx) e.sPanner.pan.setTargetAtTime(0, audioCtx.currentTime, 0.1); });
      }
      lucide.createIcons();
    });

    btnMono.addEventListener('click', () => {
      isMonoActive = !isMonoActive;
      btnMono.className = isMonoActive 
        ? "text-[10px] px-2.5 py-0.5 rounded-full bg-purple-600 text-white font-bold border border-purple-500 shadow-md shadow-purple-600/40 transition flex items-center gap-1 shrink-0"
        : "text-[10px] px-2.5 py-0.5 rounded-full bg-zinc-900 text-slate-300 font-bold border border-zinc-800 hover:border-purple-500 hover:text-purple-400 transition flex items-center gap-1 shrink-0";
      btnMono.innerHTML = `<i data-lucide="disc" class="w-3 h-3"></i> <span>Audio: ${isMonoActive ? 'Mono' : 'Stereo'}</span>`;
      
      engines.forEach(e => {
        if (e.monoNode && audioCtx) {
          e.monoNode.channelCount = isMonoActive ? 1 : 2;
        }
      });
      lucide.createIcons();
    });

    function tickBeat() {
      if (audioCtx && isPlaying) {
        if (is8DActive) {
          pannerAngle += 0.03;
          const panVal = Math.sin(pannerAngle);
          engines.forEach(e => {
            if (e.sPanner && !e.mediaEl.paused) e.sPanner.pan.setTargetAtTime(panVal, audioCtx.currentTime, 0.05);
          });
        }

        if (currentBass > 0) {
          engines.forEach((e) => {
            if (e.mediaEl.paused) return;
            const dataArray = new Uint8Array(e.analyzer.frequencyBinCount);
            e.analyzer.getByteFrequencyData(dataArray);

            let bassSum = 0;
            for (let i = 0; i < 6; i++) bassSum += dataArray[i];
            const currentBassLevel = bassSum / 6;

            e.beatThreshold = e.beatThreshold * 0.97 + currentBassLevel * 0.03;
            if (currentBassLevel > e.beatThreshold * 1.3 && (audioCtx.currentTime - e.lastBeatTime) > 0.16) {
              e.deepEngine.gain.setTargetAtTime((currentBass * 1.2) * 1.25, audioCtx.currentTime, 0.03);
              setTimeout(() => {
                if (e.deepEngine) e.deepEngine.gain.setTargetAtTime(currentBass * 1.2, audioCtx.currentTime, 0.18);
              }, 85);
              e.lastBeatTime = audioCtx.currentTime;
            }
          });
        }
      }
      requestAnimationFrame(tickBeat);
    }
    tickBeat();

    function getActiveMedia() {
      const list = getActivePlaylist();
      const track = list[currentTrackIndex];
      return (currentMode === 'local' && track && track.type === 'video') ? video : audio;
    }

    // ==========================================
    // CARGA Y REPRODUCCIÓN (CON SOPORTE HLS Y FAILOVER)
    // ==========================================
    function loadTrack(index, savedTime = 0) {
      const list = getActivePlaylist();
      if (list.length === 0 || index < 0 || index >= list.length) return;
      pauseTrack();
      currentTrackIndex = index;
      const track = list[index];
      activeTrackId = track.id;

      if (currentMode === 'local' && track.type === 'video') {
        videoWrapper.style.display = 'block';
        centerControls.style.display = 'none';
        video.src = track.src;
        video.load();
        attach(video);
        if (savedTime > 0) video.currentTime = savedTime;
      } else {
        videoWrapper.style.display = 'none';
        centerControls.style.display = 'flex';
        
        let streamUrl = '';
        if (currentMode === 'radios') {
          streamUrl = track.urls && track.urls.length > 0 ? track.urls[currentUrlIndex] : '';
          streamStatusText.textContent = `Emisora: ${track.title} (Opción ${currentUrlIndex + 1})`;
        } else {
          streamUrl = track.src;
          streamStatusText.textContent = `Local: ${track.title}`;
        }

        if (hlsInstance) {
          hlsInstance.destroy();
          hlsInstance = null;
        }

        if (streamUrl && streamUrl.includes('.m3u8')) {
          if (Hls.isSupported()) {
            hlsInstance = new Hls();
            hlsInstance.loadSource(streamUrl);
            hlsInstance.attachMedia(audio);
            hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => playTrack());
            hlsInstance.on(Hls.Events.ERROR, (event, data) => {
              if (data.fatal) handleStreamFailure();
            });
          } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
            audio.src = streamUrl;
            audio.load();
            attach(audio);
          }
        } else {
          audio.src = streamUrl;
          audio.load();
          attach(audio);
          if (savedTime > 0) audio.currentTime = savedTime;
        }
      }

      trackTitle.textContent = track.title;
      trackArtist.textContent = track.artist || 'Audio HD';
      if (trackGenre) trackGenre.textContent = track.genre;

      setupMediaSession(track);
      updateActiveTrackStyle();
      scrollToActiveTrack();
    }

    // Sistema de Respaldo Automático (Failover)
    audio.addEventListener('error', () => {
      if (currentMode === 'radios') handleStreamFailure();
    });

    function handleStreamFailure() {
      const list = getActivePlaylist();
      const track = list[currentTrackIndex];
      if (track && track.urls && currentUrlIndex < track.urls.length - 1) {
        currentUrlIndex++;
        streamStatusText.textContent = `⚠️ Enlace caído. Cambiando a opción ${currentUrlIndex + 1}...`;
        setTimeout(() => { loadTrack(currentTrackIndex); playTrack(); }, 1000);
      } else {
        streamStatusText.textContent = `❌ Error: Stream no disponible`;
      }
    }

    function scrollToActiveTrack() {
      const activeCard = playlistContainer.querySelector(`[data-id="${activeTrackId}"]`);
      if (activeCard) activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // ==========================================
    // RENDERIZADO DE LISTA SIN EFECTOS / CON "SONANDO"
    // ==========================================
    function renderPlaylist() {
      playlistContainer.innerHTML = '';
      const visibleList = getFilteredPlaylist();
      playlistCount.textContent = `${visibleList.length} ${currentMode === 'local' ? 'archivos' : 'emisoras'}`;

      if (visibleList.length === 0) {
        playlistContainer.innerHTML = `
          <div class="text-center py-10 text-zinc-500 text-xs flex flex-col items-center justify-center h-full">
            <i data-lucide="${currentMode === 'local' ? 'music-4' : 'radio'}" class="w-8 h-8 mb-2 opacity-40"></i>
            <span>No hay elementos disponibles.</span>
            <span class="text-[10px] text-zinc-600 mt-1">${currentMode === 'local' ? 'Usa "Importar" para agregar música' : 'Cargando JSON...'}</span>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      const fragment = document.createDocumentFragment();
      const activeList = getActivePlaylist();

      visibleList.forEach((track) => {
        const realIndex = activeList.findIndex(t => t.id === track.id);
        const isCurrent = track.id === activeTrackId;
        const card = document.createElement('div');
        
        card.setAttribute('data-id', track.id);
        card.setAttribute('data-index', realIndex);

        if (isCurrent) {
          card.className = `playlist-item group flex items-center justify-between p-2.5 rounded-xl border border-zinc-700 bg-zinc-900 text-white shadow-md shrink-0`;
        } else {
          card.className = `playlist-item group flex items-center justify-between p-2.5 rounded-xl border transition-colors duration-150 cursor-pointer shrink-0 bg-black/60 hover:bg-zinc-900/60 text-slate-300 border-zinc-900`;
        }

        const iconType = currentMode === 'local' && track.type === 'video' ? 'film' : (currentMode === 'radios' ? 'radio' : 'disc');

        card.innerHTML = `
          <div class="flex items-center gap-2.5 overflow-hidden">
            <div class="w-8 h-8 rounded-lg ${isCurrent ? 'bg-purple-600 text-white' : 'bg-zinc-900 border border-zinc-800 text-slate-400'} flex items-center justify-center font-bold text-xs shadow-md shrink-0 overflow-hidden">
              <i data-lucide="${isCurrent && isPlaying ? 'volume-2' : iconType}" class="w-4 h-4 ${isCurrent && isPlaying ? 'animate-pulse' : ''}"></i>
            </div>
            <div class="truncate">
              <div class="flex items-center gap-1.5">
                <h3 class="font-bold text-xs truncate ${isCurrent ? 'text-white' : 'text-slate-200'}">${track.title}</h3>
                ${isCurrent ? `<span class="text-[8px] font-black tracking-widest px-1.5 py-0.2 rounded bg-purple-500/30 text-purple-300 border border-purple-500/50 animate-pulse">SONANDO</span>` : ''}
              </div>
              <p class="text-[10px] ${isCurrent ? 'text-slate-300' : 'text-slate-400'} truncate">${track.artist}</p>
            </div>
          </div>
          <div class="flex items-center gap-2 shrink-0 ml-2">
            <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full border border-zinc-800 bg-zinc-900/80 text-purple-400">
              ${track.genre}
            </span>
          </div>
        `;

        card.addEventListener('click', () => {
          currentUrlIndex = 0;
          if (activeTrackId !== track.id || !isPlaying) {
            loadTrack(realIndex);
            playTrack();
          } else {
            togglePlay();
          }
        });

        fragment.appendChild(card);
      });

      playlistContainer.appendChild(fragment);
      lucide.createIcons();
    }

    function updateActiveTrackStyle() {
      Array.from(playlistContainer.children).forEach((child) => {
        const id = child.getAttribute('data-id');
        const isCurrent = id === activeTrackId;
        const idx = parseInt(child.getAttribute('data-index'));

        if (isCurrent) {
          child.className = `playlist-item group flex items-center justify-between p-2.5 rounded-xl border border-zinc-700 bg-zinc-900 text-white shadow-md shrink-0`;
        } else {
          child.className = `playlist-item group flex items-center justify-between p-2.5 rounded-xl border transition-colors duration-150 cursor-pointer shrink-0 bg-black/60 hover:bg-zinc-900/60 text-slate-300 border-zinc-900`;
        }

        const iconContainer = child.querySelector('.w-8.h-8');
        if (iconContainer) {
          const iconType = currentMode === 'local' && getActivePlaylist()[idx]?.type === 'video' ? 'film' : (currentMode === 'radios' ? 'radio' : 'disc');
          iconContainer.className = `w-8 h-8 rounded-lg ${isCurrent ? 'bg-purple-600 text-white' : 'bg-zinc-900 border border-zinc-800 text-slate-400'} flex items-center justify-center font-bold text-xs shadow-md shrink-0 overflow-hidden`;
          iconContainer.innerHTML = `<i data-lucide="${isCurrent && isPlaying ? 'volume-2' : iconType}" class="w-4 h-4 ${isCurrent && isPlaying ? 'animate-pulse' : ''}"></i>`;
        }
      });
      lucide.createIcons();
    }

    function togglePlay() {
      const list = getActivePlaylist();
      if (list.length === 0) return;
      if (isPlaying) pauseTrack();
      else playTrack();
    }

    function playTrack() {
      const list = getActivePlaylist();
      if (list.length === 0) return;
      const activeMedia = getActiveMedia();
      attach(activeMedia);

      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

      activeMedia.play().then(() => {
        isPlaying = true;
        playIcon.setAttribute('data-lucide', 'pause');
        playingBadge.style.opacity = '1';
        requestWakeLock();
        startBackgroundKeepAlive();
        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
        lucide.createIcons();
        updateActiveTrackStyle();
      }).catch(err => {});
    }

    function pauseTrack() {
      audio.pause();
      video.pause();
      isPlaying = false;
      playIcon.setAttribute('data-lucide', 'play');
      playingBadge.style.opacity = '0';
      releaseWakeLock();
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
      lucide.createIcons();
      updateActiveTrackStyle();
    }

    btnPlay.addEventListener('click', togglePlay);
    
    btnPrev.addEventListener('click', () => {
      const list = getActivePlaylist();
      if (list.length === 0) return;
      currentUrlIndex = 0;
      currentTrackIndex = (currentTrackIndex - 1 + list.length) % list.length;
      loadTrack(currentTrackIndex);
      playTrack();
    });

    btnNext.addEventListener('click', () => {
      const list = getActivePlaylist();
      if (list.length === 0) return;
      currentUrlIndex = 0;
      if (isShuffleActive) {
        currentTrackIndex = Math.floor(Math.random() * list.length);
      } else {
        currentTrackIndex = (currentTrackIndex + 1) % list.length;
      }
      loadTrack(currentTrackIndex);
      playTrack();
    });

    // Lógica al terminar la reproducción (soporta repetición)
    function handleTrackEnded() {
      if (isRepeatActive) {
        const activeMedia = getActiveMedia();
        activeMedia.currentTime = 0;
        playTrack();
      } else {
        btnNext.click();
      }
    }

    audio.addEventListener('ended', () => {
      if (currentMode === 'local' || isRepeatActive) handleTrackEnded();
    });
    video.addEventListener('ended', () => { handleTrackEnded(); });

    function handleTimeUpdate(media) {
      if (!media.duration || media !== getActiveMedia()) return;
      progressBar.value = (media.currentTime / media.duration) * 100;

      const curMin = Math.floor(media.currentTime / 60);
      const curSec = Math.floor(media.currentTime % 60);
      currentTimeEl.textContent = `${curMin}:${curSec < 10 ? '0' : ''}${curSec}`;

      const durMin = Math.floor(media.duration / 60);
      const durSec = Math.floor(media.duration % 60);
      totalDurationEl.textContent = `${durMin}:${durSec < 10 ? '0' : ''}${durSec}`;
    }

    audio.addEventListener('timeupdate', () => {
      if (currentMode === 'radios') {
        currentTimeEl.textContent = "LIVE";
        totalDurationEl.textContent = "Streaming HD";
        progressBar.value = 100;
      } else {
        handleTimeUpdate(audio);
      }
    });
    video.addEventListener('timeupdate', () => handleTimeUpdate(video));

    progressBar.addEventListener('input', () => {
      if (currentMode === 'local' && getActivePlaylist().length > 0) {
        const activeMedia = getActiveMedia();
        activeMedia.currentTime = (progressBar.value / 100) * activeMedia.duration;
      }
    });

    volumeBar.addEventListener('input', () => {
      const val = volumeBar.value / 100;
      audio.volume = val;
      video.volume = val;
    });

    // ==========================================
    // IMPORTACIÓN LOCAL
    // ==========================================
    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      const previousLength = localPlaylist.length;
      const now = Date.now();

      let batch = [];
      files.forEach((file, idx) => {
        const isVideo = file.type.startsWith('video/') || /\.(mp4|webm|ogg|mov|mkv)$/i.test(file.name);
        const ext = file.name.split('.').pop().toUpperCase();
        
        let folderGenre = ext;
        if (file.webkitRelativePath && file.webkitRelativePath.includes('/')) {
          folderGenre = file.webkitRelativePath.split('/')[0];
        }

        batch.push({
          id: now + idx,
          title: file.name.replace(/\.[^/.]+$/, ""),
          artist: isVideo ? "Video HD Local" : `Audio ${ext} HD`,
          genre: isVideo ? "Video" : folderGenre,
          type: isVideo ? "video" : "audio",
          src: URL.createObjectURL(file)
        });
      });

      localPlaylist = localPlaylist.concat(batch);
      if (currentMode === 'local') {
        updateGenreFilterUI();
        renderPlaylist();
      }

      if (!isPlaying && previousLength === 0 && currentMode === 'local') {
        loadTrack(0);
      }
    });

    ['click', 'keydown', 'touchstart'].forEach(evt =>
      document.addEventListener(evt, () => {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      }, { passive: true })
    );

    // Cargar las radios del JSON al iniciar e inicializar vista local
    loadRadiosJson();
    renderPlaylist();
  </script>
</body>
</html>
