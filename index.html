<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CarPlayer Pro - Audio Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="capacitor.js"></script>
  <style>
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 4px;
    }
    .vertical-slider {
      -webkit-appearance: slider-vertical;
      appearance: slider-vertical;
      writing-mode: bt-lr;
    }
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin-disc {
      animation: spin-slow 2s linear infinite;
    }
  </style>
</head>
<body class="bg-black text-slate-100 h-screen w-screen overflow-hidden flex flex-col font-sans antialiased select-none relative">

  <!-- PANTALLA DE CARGA (IMPORTAR ARCHIVOS) -->
  <div id="loading-screen" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex flex-col items-center justify-center hidden">
    <div class="flex flex-col items-center gap-3 p-6 bg-zinc-950 border border-zinc-800 rounded-2xl shadow-2xl">
      <div class="relative w-16 h-16 flex items-center justify-center">
        <i data-lucide="disc" class="w-16 h-16 text-purple-500 animate-spin-disc"></i>
        <i data-lucide="music" class="w-6 h-6 text-white absolute"></i>
      </div>
      <h2 class="text-sm font-bold text-white tracking-wide">Cargando archivos...</h2>
      <p class="text-[11px] text-slate-400">Por favor espere mientras procesamos su música</p>
    </div>
  </div>

  <!-- PANTALLA DE DESPEDIDA "GOODBYE" -->
  <div id="goodbye-screen" class="fixed inset-0 bg-black z-50 flex flex-col items-center justify-center hidden transition-opacity duration-500 opacity-0">
    <div class="text-center p-5 bg-zinc-950 border border-zinc-800 rounded-2xl shadow-2xl max-w-xs w-full mx-4 flex flex-col items-center gap-2">
      <div class="w-full max-w-[160px] shrink-0">
        <img src="https://raw.githubusercontent.com/juanrtrt55-design/index.html/refs/heads/main/adios.jpg" alt="Goodbye" class="w-full h-auto object-contain rounded-xl">
      </div>
      <h1 class="text-2xl font-extrabold tracking-wider text-white">Goodbye</h1>
      <p class="text-[11px] text-purple-400 font-semibold">Saliendo de la aplicación...</p>
    </div>
  </div>

  <!-- CONTENEDOR PRINCIPAL FIJO -->
  <div class="max-w-md w-full mx-auto h-full p-2 flex flex-col gap-2 overflow-hidden bg-black">

    <!-- 1. REPRODUCTOR COMPACTO Y ESTÁTICO (ARRIBA) -->
    <header class="bg-zinc-950 border border-zinc-800 rounded-xl p-2 shadow-lg overflow-hidden shrink-0 relative">
      <div class="flex flex-col gap-1.5 relative z-10">
        
        <div class="flex items-center justify-between gap-1.5">
          <!-- BUSCADOR CON LUPA -->
          <div class="relative flex items-center shrink-0">
            <i data-lucide="search" class="w-3 h-3 text-slate-400 absolute left-2 pointer-events-none"></i>
            <input type="text" id="search-input" placeholder="Buscar..." class="bg-zinc-900 border border-zinc-800 rounded-full text-[11px] text-white pl-6 pr-2 py-0.5 w-24 md:w-32 focus:outline-none focus:border-purple-500 transition">
          </div>
          
          <div class="flex items-center gap-1.5 overflow-x-auto custom-scroll">
            <button id="btn-8d" class="text-[9px] px-2 py-0.5 rounded-full bg-zinc-900 text-slate-300 font-bold border border-zinc-800 hover:border-purple-500 hover:text-purple-400 transition flex items-center gap-1 shrink-0">
              <i data-lucide="headphones" class="w-2.5 h-2.5"></i> <span>8D: OFF</span>
            </button>

            <button id="btn-mono" class="text-[9px] px-2 py-0.5 rounded-full bg-zinc-900 text-slate-300 font-bold border border-zinc-800 hover:border-purple-500 hover:text-purple-400 transition flex items-center gap-1 shrink-0">
              <i data-lucide="disc" class="w-2.5 h-2.5"></i> <span>Audio: Stereo</span>
            </button>

            <span id="playing-badge" class="bg-emerald-600 text-white text-[9px] px-1.5 py-0.5 rounded-full font-medium flex items-center gap-1 opacity-0 transition-opacity pointer-events-none shrink-0">
              <span class="w-1 h-1 bg-white rounded-full animate-pulse"></span> Sonando
            </span>
          </div>
        </div>

        <!-- CONTENEDOR DE MEDIOS Y CONTROLES -->
        <div class="flex items-center gap-1.5 w-full">
          
          <!-- SLIDER BAJO -->
          <div class="flex flex-col items-center gap-0.5 shrink-0 bg-black/80 p-1 rounded-lg border border-zinc-800">
            <span class="text-[8px] font-semibold text-purple-400">Bajo</span>
            <input type="range" id="bass-slider" min="0" max="29" value="29" class="vertical-slider h-20 w-3 bg-zinc-900 rounded-lg cursor-pointer accent-purple-500">
          </div>

          <!-- CONTENEDOR PRINCIPAL DE TITULO Y CONTROLES -->
          <div id="media-display-container" class="w-full relative rounded-lg overflow-hidden bg-black flex flex-col flex-1 border border-zinc-800">
            
            <div id="video-wrapper" style="display: none;" class="w-full h-24 rounded-lg overflow-hidden bg-black relative">
              <video id="video-player" crossorigin="anonymous" playsinline class="w-full h-full object-cover"></video>
            </div>

            <div id="center-controls" class="w-full h-24 mx-auto rounded-lg bg-zinc-900 shadow-md flex flex-col justify-center items-center p-2 relative gap-1.5">
              <div class="text-center w-full px-1">
                <h1 id="track-title" class="text-[11px] md:text-xs font-bold tracking-tight text-white leading-tight break-words max-h-7 overflow-y-auto custom-scroll">Selecciona un archivo o radio</h1>
                <p id="track-artist" class="text-slate-400 text-[9px] font-medium mt-0.5 truncate">Motor HD Activo</p>
              </div>

              <div class="flex items-center justify-center gap-3">
                <button id="btn-center-prev" class="p-1.5 rounded-full bg-zinc-800 hover:bg-zinc-700 text-slate-200 transition">
                  <i data-lucide="skip-back" class="w-4 h-4"></i>
                </button>
                <button id="btn-center-play" class="p-2 rounded-full bg-purple-600 hover:bg-purple-500 text-white shadow-md shadow-purple-600/40 transition active:scale-95">
                  <i data-lucide="play" id="center-play-icon" class="w-5 h-5 fill-current"></i>
                </button>
                <button id="btn-center-next" class="p-1.5 rounded-full bg-zinc-800 hover:bg-zinc-700 text-slate-200 transition">
                  <i data-lucide="skip-forward" class="w-4 h-4"></i>
                </button>
              </div>
            </div>

          </div>

          <!-- SLIDER TWISTER -->
          <div class="flex flex-col items-center gap-0.5 shrink-0 bg-black/80 p-1 rounded-lg border border-zinc-800">
            <span class="text-[8px] font-semibold text-indigo-400">Twister</span>
            <input type="range" id="tweeter-slider" min="0" max="29" value="12" class="vertical-slider h-20 w-3 bg-zinc-900 rounded-lg cursor-pointer accent-indigo-500">
          </div>

        </div>

        <!-- BARRA PROGRESO Y VOLUMEN -->
        <div class="w-full flex flex-col justify-between gap-0.5 mt-0.5">
          <div class="flex justify-between items-center">
            <span id="stream-status-text" class="text-[9px] text-purple-400 font-mono truncate max-w-[180px]">Listo</span>
            <div class="flex items-center gap-1 shrink-0">
              <i data-lucide="volume-2" class="w-3 h-3 text-slate-400"></i>
              <input type="range" id="volume-bar" value="80" min="0" max="100" class="w-14 h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer accent-purple-500">
            </div>
          </div>

          <div class="space-y-0.5">
            <input type="range" id="progress-bar" value="0" min="0" max="100" class="w-full h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer accent-purple-500">
            <div class="flex justify-between text-[9px] text-slate-400 font-mono">
              <span id="current-time">0:00</span>
              <span id="total-duration">En vivo / 0:00</span>
            </div>
          </div>
        </div>

        <!-- PESTAÑAS Y ACCIONES -->
        <div class="flex items-center gap-1.5 pt-1 border-t border-zinc-900 overflow-x-auto custom-scroll">
          <button id="tab-local" class="text-[9px] px-2 py-0.5 rounded-lg bg-purple-600 text-white font-bold shrink-0 transition flex items-center gap-1">
            <i data-lucide="folder-music" class="w-3 h-3"></i> Local
          </button>
          <button id="tab-radios" class="text-[9px] px-2 py-0.5 rounded-lg bg-zinc-900 hover:bg-zinc-800 text-slate-300 border border-zinc-800 font-bold shrink-0 transition flex items-center gap-1">
            <i data-lucide="radio" class="w-3 h-3 text-emerald-400"></i> Radios
          </button>
          
          <div class="ml-auto flex items-center gap-1 shrink-0" id="local-extra-controls">
            <button id="filter-all" class="text-[9px] px-2 py-0.5 rounded-lg bg-purple-600 text-white font-bold shrink-0 transition">
              Todos
            </button>
            <div id="genre-filters-container" class="flex items-center gap-1 shrink-0"></div>
            <button id="btn-shuffle" class="p-1 rounded-lg bg-zinc-900 text-slate-300 border border-zinc-800 text-[9px]">
              <i data-lucide="shuffle" class="w-3 h-3"></i>
            </button>
            <button id="btn-repeat" class="p-1 rounded-lg bg-zinc-900 text-slate-300 border border-zinc-800 text-[9px]">
              <i data-lucide="repeat" class="w-3 h-3"></i>
            </button>
          </div>
        </div>

      </div>
    </header>

    <!-- 2. LISTA DE ARCHIVOS -->
    <main class="bg-zinc-950 border border-zinc-800/80 rounded-xl p-2 flex flex-col flex-1 min-h-0 overflow-hidden">
      <div class="flex items-center justify-between mb-1.5 px-0.5 shrink-0">
        <h2 id="list-title" class="text-[11px] font-bold text-slate-200 flex items-center gap-1">
          <i data-lucide="list-music" class="w-3 h-3 text-purple-400"></i> Lista de Archivos Locales
        </h2>
        <span id="playlist-count" class="text-[9px] text-slate-400 font-medium">0 archivos</span>
      </div>

      <div id="playlist-container" class="custom-scroll space-y-1 overflow-y-auto flex-1 pr-0.5">
      </div>
    </main>

    <!-- 3. BARRA INFERIOR CON PAYPAL -->
    <footer class="bg-zinc-950 border border-zinc-800 py-2 px-2.5 rounded-xl shrink-0 flex items-center justify-between">
      
      <!-- BOTÓN DONAR EN PAYPAL (EXTERNO) -->
      <button id="btn-paypal" class="flex items-center gap-1 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-bold text-[11px] px-2.5 py-1 rounded-lg shadow-md transition">
        <i data-lucide="heart" class="w-3 h-3 text-red-400 fill-current"></i>
        <span>Donar PayPal</span>
      </button>

      <div class="flex items-center gap-1.5">
        <!-- Importar -->
        <div>
          <input type="file" id="file-input" accept="audio/*,video/*,.mp3,.wav,.wma,.m4a,.aac,.ogg,.flac,.mp4,.mkv,.webm,.mov" multiple class="hidden">
          <button onclick="document.getElementById('file-input').click()" class="flex items-center gap-1 bg-yellow-400 hover:bg-yellow-300 text-zinc-950 font-bold text-[11px] px-2.5 py-1 rounded-lg shadow-md transition">
            <i data-lucide="folder-plus" class="w-3 h-3 stroke-[2.5]"></i>
            <span>Importar</span>
          </button>
        </div>

        <!-- Salir -->
        <button id="btn-exit" class="flex items-center gap-1 bg-red-600 hover:bg-red-500 active:bg-red-700 text-white font-bold text-[11px] px-2.5 py-1 rounded-lg shadow-md transition">
          <i data-lucide="power" class="w-3 h-3 stroke-[2.5]"></i>
          <span>Salir</span>
        </button>
      </div>
    </footer>

  </div>

  <audio id="audio-player" crossorigin="anonymous" playsinline preload="auto"></audio>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    lucide.createIcons();

    let localPlaylist = [];
    let radiosPlaylist = [];
    let currentMode = 'local';
    let currentTrackIndex = -1;
    let activeTrackId = null;
    let currentUrlIndex = 0;
    let isPlaying = false;
    let is8DActive = false;
    let isMonoActive = false;
    let isShuffleActive = false;
    let isRepeatActive = false;
    let currentGenreFilter = 'all';
    let searchQuery = '';
    let wakeLock = null;
    let hlsInstance = null;

    const audio = document.getElementById('audio-player');
    const video = document.getElementById('video-player');
    const videoWrapper = document.getElementById('video-wrapper');
    const centerControls = document.getElementById('center-controls');
    const loadingScreen = document.getElementById('loading-screen');

    const btnPlay = document.getElementById('btn-center-play');
    const playIcon = document.getElementById('center-play-icon');
    const btnPrev = document.getElementById('btn-center-prev');
    const btnNext = document.getElementById('btn-center-next');
    const btn8D = document.getElementById('btn-8d');
    const btnMono = document.getElementById('btn-mono');
    const btnShuffle = document.getElementById('btn-shuffle');
    const btnRepeat = document.getElementById('btn-repeat');
    const filterAllBtn = document.getElementById('filter-all');
    const genreFiltersContainer = document.getElementById('genre-filters-container');
    const searchInput = document.getElementById('search-input');
    const btnExit = document.getElementById('btn-exit');
    const btnPaypal = document.getElementById('btn-paypal');
    const goodbyeScreen = document.getElementById('goodbye-screen');
    const localExtraControls = document.getElementById('local-extra-controls');

    const tabLocal = document.getElementById('tab-local');
    const tabRadios = document.getElementById('tab-radios');
    const listTitle = document.getElementById('list-title');
    const streamStatusText = document.getElementById('stream-status-text');

    const progressBar = document.getElementById('progress-bar');
    const volumeBar = document.getElementById('volume-bar');
    const currentTimeEl = document.getElementById('current-time');
    const totalDurationEl = document.getElementById('total-duration');
    const trackTitle = document.getElementById('track-title');
    const trackArtist = document.getElementById('track-artist');
    const playingBadge = document.getElementById('playing-badge');
    const playlistContainer = document.getElementById('playlist-container');
    const playlistCount = document.getElementById('playlist-count');
    const fileInput = document.getElementById('file-input');

    const bassSlider = document.getElementById('bass-slider');
    const tweeterSlider = document.getElementById('tweeter-slider');

    // REDIRECCIÓN A PAYPAL NAVEGADOR EXTERNO
    btnPaypal.addEventListener('click', () => {
      const paypalUrl = 'https://www.paypal.com/paypalme/juanrtrt55'; // Reemplazar por tu enlace de PayPal
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
        window.open(paypalUrl, '_system');
      } else {
        window.open(paypalUrl, '_blank');
      }
    });

    async function loadRadiosJson() {
      try {
        const response = await fetch('https://raw.githubusercontent.com/pitufoardiente000/Radio/refs/heads/main/radios.json');
        const data = await response.json();
        const rawList = Array.isArray(data) ? data : (data.radios || data.channels || []);
        
        radiosPlaylist = rawList.map((r, idx) => ({
          id: r.id || 'r_' + idx,
          title: r.title || r.name || r.station || `Radio ${idx + 1}`,
          artist: r.artist || r.descripcion || 'Radio en Vivo',
          genre: r.genre || r.categoria || r.category || 'Online',
          type: 'audio',
          urls: r.urls ? r.urls : (r.url ? [r.url] : (r.stream ? [r.stream] : []))
        }));

        if (currentMode === 'radios') renderPlaylist();
      } catch (err) {}
    }

    function getActivePlaylist() {
      return currentMode === 'local' ? localPlaylist : radiosPlaylist;
    }

    tabLocal.addEventListener('click', () => {
      currentMode = 'local';
      tabLocal.className = "text-[9px] px-2 py-0.5 rounded-lg bg-purple-600 text-white font-bold shrink-0 transition flex items-center gap-1";
      tabRadios.className = "text-[9px] px-2 py-0.5 rounded-lg bg-zinc-900 hover:bg-zinc-800 text-slate-300 border border-zinc-800 font-bold shrink-0 transition flex items-center gap-1";
      localExtraControls.style.display = 'flex';
      listTitle.innerHTML = `<i data-lucide="list-music" class="w-3 h-3 text-purple-400"></i> Lista de Archivos Locales`;
      currentGenreFilter = 'all';
      updateGenreFilterUI();
      renderPlaylist();
      lucide.createIcons();
    });

    tabRadios.addEventListener('click', () => {
      currentMode = 'radios';
      tabRadios.className = "text-[9px] px-2 py-0.5 rounded-lg bg-emerald-600 text-white font-bold shrink-0 transition flex items-center gap-1";
      tabLocal.className = "text-[9px] px-2 py-0.5 rounded-lg bg-zinc-900 hover:bg-zinc-800 text-slate-300 border border-zinc-800 font-bold shrink-0 transition flex items-center gap-1";
      localExtraControls.style.display = 'none';
      listTitle.innerHTML = `<i data-lucide="radio" class="w-3 h-3 text-emerald-400"></i> Radios en Línea`;
      searchQuery = '';
      searchInput.value = '';
      renderPlaylist();
      lucide.createIcons();
    });

    btnExit.addEventListener('click', () => {
      pauseTrack();
      if (audioCtx) audioCtx.close();

      goodbyeScreen.classList.remove('hidden');
      setTimeout(() => {
        goodbyeScreen.classList.remove('opacity-0');
        goodbyeScreen.classList.add('opacity-100');
      }, 10);

      setTimeout(() => {
        try {
          if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
            window.Capacitor.Plugins.App.exitApp();
          } else {
            window.close();
          }
        } catch (err) {
          window.close();
        }
      }, 1800);
    });

    filterAllBtn.addEventListener('click', () => {
      currentGenreFilter = 'all';
      updateGenreFilterUI();
      renderPlaylist();
    });

    btnShuffle.addEventListener('click', () => {
      isShuffleActive = !isShuffleActive;
      btnShuffle.className = isShuffleActive 
        ? "p-1 rounded-lg bg-purple-600 text-white font-bold transition text-[9px]"
        : "p-1 rounded-lg bg-zinc-900 text-slate-300 border border-zinc-800 text-[9px]";
    });

    btnRepeat.addEventListener('click', () => {
      isRepeatActive = !isRepeatActive;
      btnRepeat.className = isRepeatActive 
        ? "p-1 rounded-lg bg-purple-600 text-white font-bold transition text-[9px]"
        : "p-1 rounded-lg bg-zinc-900 text-slate-300 border border-zinc-800 text-[9px]";
    });

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      renderPlaylist();
    });

    function getFilteredPlaylist() {
      const list = getActivePlaylist();
      if (currentMode === 'radios') {
        return list.filter(track => searchQuery === '' || track.title.toLowerCase().includes(searchQuery) || track.genre.toLowerCase().includes(searchQuery));
      }
      return list.filter(track => {
        const matchesGenre = currentGenreFilter === 'all' || track.genre.toLowerCase() === currentGenreFilter.toLowerCase();
        const matchesSearch = searchQuery === '' || track.title.toLowerCase().includes(searchQuery) || track.artist.toLowerCase().includes(searchQuery);
        return matchesGenre && matchesSearch;
      });
    }

    function updateGenreFilterUI() {
      if (currentMode !== 'local') return;
      filterAllBtn.className = currentGenreFilter === 'all' 
        ? "text-[9px] px-2 py-0.5 rounded-lg bg-purple-600 text-white font-bold shrink-0 transition"
        : "text-[9px] px-2 py-0.5 rounded-lg bg-zinc-900 text-slate-300 border border-zinc-800 shrink-0 transition";

      genreFiltersContainer.innerHTML = '';
      const uniqueGenres = [...new Set(localPlaylist.map(t => t.genre))];

      uniqueGenres.forEach(genre => {
        const isActive = currentGenreFilter.toLowerCase() === genre.toLowerCase();
        const btn = document.createElement('button');
        btn.className = `text-[9px] px-2 py-0.5 rounded-lg shrink-0 transition font-semibold ${
          isActive ? 'bg-purple-600 text-white' : 'bg-zinc-900 text-slate-300 border border-zinc-800'
        }`;
        btn.textContent = genre;
        btn.addEventListener('click', () => {
          currentGenreFilter = genre;
          updateGenreFilterUI();
          renderPlaylist();
        });
        genreFiltersContainer.appendChild(btn);
      });
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen');
      } catch (err) {}
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release().then(() => { wakeLock = null; });
      }
    }

    function setupMediaSession(track) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: track.title,
          artist: track.artist || 'CarPlayer Pro HD',
          album: currentMode === 'local' ? 'Local Music' : 'Radio Station',
          artwork: [{ src: 'https://raw.githubusercontent.com/juanrtrt55-design/index.html/refs/heads/main/adios.jpg', sizes: '512x512', type: 'image/jpeg' }]
        });
        navigator.mediaSession.setActionHandler('play', () => playTrack());
        navigator.mediaSession.setActionHandler('pause', () => pauseTrack());
        navigator.mediaSession.setActionHandler('previoustrack', () => btnPrev.click());
        navigator.mediaSession.setActionHandler('nexttrack', () => btnNext.click());
      }
    }

    let audioCtx = null;
    let currentBass = parseFloat(bassSlider.value);
    let currentTweeter = parseFloat(tweeterSlider.value);
    let pannerAngle = 0;
    const processed = new WeakSet();
    const engines = [];

    function getAudioContext() {
      if (!audioCtx) {
        const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioCtxClass({ latencyHint: 'playback' });
      }
      return audioCtx;
    }

    function attach(mediaEl) {
      if (!mediaEl || processed.has(mediaEl)) return;
      try {
        const ctx = getAudioContext();
        const source = ctx.createMediaElementSource(mediaEl);
        const analyzer = ctx.createAnalyser();
        analyzer.fftSize = 512;

        const masterInput = ctx.createGain();
        masterInput.gain.value = 0.35;

        const bassSplitter = ctx.createGain();
        const subsonicFilter = ctx.createBiquadFilter();
        subsonicFilter.type = 'highpass';
        subsonicFilter.frequency.value = 5;

        const bassLowpass = ctx.createBiquadFilter();
        bassLowpass.type = 'lowpass';
        bassLowpass.frequency.value = 20;

        const subEngine = ctx.createBiquadFilter();
        subEngine.type = 'lowshelf';
        subEngine.frequency.value = 100;

        const deepEngine = ctx.createBiquadFilter();
        deepEngine.type = 'peaking';
        deepEngine.frequency.value = 43;

        const bassCompressor = ctx.createDynamicsCompressor();
        const bassOutput = ctx.createGain();

        const mainSplitter = ctx.createGain();
        const clarity = ctx.createBiquadFilter();
        clarity.type = 'peaking';
        clarity.frequency.value = 2800;
        clarity.gain.value = 10;

        const air = ctx.createBiquadFilter();
        air.type = 'highshelf';
        air.frequency.value = 12000;
        air.gain.value = 8;

        const mainOutput = ctx.createGain();
        const masterSum = ctx.createGain();

        const tweeterNode = ctx.createBiquadFilter();
        tweeterNode.type = 'highshelf';
        tweeterNode.frequency.value = 10000;

        const monoNode = ctx.createGain();
        monoNode.channelCount = isMonoActive ? 1 : 2;
        monoNode.channelCountMode = 'explicit';

        let sPanner = ctx.createStereoPanner ? ctx.createStereoPanner() : null;

        source.connect(masterInput);
        masterInput.connect(bassSplitter);
        bassSplitter.connect(subsonicFilter);
        subsonicFilter.connect(bassLowpass);
        bassLowpass.connect(subEngine);
        subEngine.connect(deepEngine);
        deepEngine.connect(bassCompressor);
        bassCompressor.connect(bassOutput);
        bassOutput.connect(masterSum);

        masterInput.connect(mainSplitter);
        mainSplitter.connect(clarity);
        clarity.connect(air);
        air.connect(mainOutput);
        mainOutput.connect(masterSum);

        masterSum.connect(tweeterNode);
        tweeterNode.connect(monoNode);

        if (sPanner) {
          monoNode.connect(sPanner);
          sPanner.connect(analyzer);
        } else {
          monoNode.connect(analyzer);
        }

        analyzer.connect(ctx.destination);
        processed.add(mediaEl);
        
        const engine = { mediaEl, analyzer, masterInput, subEngine, deepEngine, tweeterNode, monoNode, sPanner };
        engines.push(engine);
        applyBass(engine, currentBass);
        applyTweeter(engine, currentTweeter);
      } catch (err) {}
    }

    function applyBass(engine, v) {
      if (!audioCtx) return;
      engine.deepEngine.gain.setTargetAtTime(v * 1.2, audioCtx.currentTime, 0.25);
      engine.subEngine.gain.setTargetAtTime(v * 0.9, audioCtx.currentTime, 0.25);
    }

    function applyTweeter(engine, v) {
      if (!audioCtx) return;
      engine.tweeterNode.gain.setTargetAtTime(v * 1.2, audioCtx.currentTime, 0.1);
    }

    bassSlider.addEventListener('input', (e) => {
      currentBass = parseFloat(e.target.value);
      engines.forEach(e => applyBass(e, currentBass));
    });

    tweeterSlider.addEventListener('input', (e) => {
      currentTweeter = parseFloat(e.target.value);
      engines.forEach(e => applyTweeter(e, currentTweeter));
    });

    btn8D.addEventListener('click', () => {
      is8DActive = !is8DActive;
      btn8D.className = is8DActive 
        ? "text-[9px] px-2 py-0.5 rounded-full bg-purple-600 text-white font-bold border border-purple-500 shadow-md transition flex items-center gap-1 shrink-0"
        : "text-[9px] px-2 py-0.5 rounded-full bg-zinc-900 text-slate-300 font-bold border border-zinc-800 hover:border-purple-500 transition flex items-center gap-1 shrink-0";
      btn8D.innerHTML = `<i data-lucide="headphones" class="w-2.5 h-2.5"></i> <span>8D: ${is8DActive ? 'ON' : 'OFF'}</span>`;
      if (!is8DActive) engines.forEach(e => { if (e.sPanner && audioCtx) e.sPanner.pan.setTargetAtTime(0, audioCtx.currentTime, 0.1); });
      lucide.createIcons();
    });

    btnMono.addEventListener('click', () => {
      isMonoActive = !isMonoActive;
      btnMono.className = isMonoActive 
        ? "text-[9px] px-2 py-0.5 rounded-full bg-purple-600 text-white font-bold border border-purple-500 shadow-md transition flex items-center gap-1 shrink-0"
        : "text-[9px] px-2 py-0.5 rounded-full bg-zinc-900 text-slate-300 font-bold border border-zinc-800 hover:border-purple-500 transition flex items-center gap-1 shrink-0";
      btnMono.innerHTML = `<i data-lucide="disc" class="w-2.5 h-2.5"></i> <span>Audio: ${isMonoActive ? 'Mono' : 'Stereo'}</span>`;
      engines.forEach(e => { if (e.monoNode) e.monoNode.channelCount = isMonoActive ? 1 : 2; });
      lucide.createIcons();
    });

    function getActiveMedia() {
      const list = getActivePlaylist();
      const track = list[currentTrackIndex];
      return (currentMode === 'local' && track && track.type === 'video') ? video : audio;
    }

    function loadTrack(index, savedTime = 0) {
      const list = getActivePlaylist();
      if (list.length === 0 || index < 0 || index >= list.length) return;
      pauseTrack();
      currentTrackIndex = index;
      const track = list[index];
      activeTrackId = track.id;

      if (currentMode === 'local' && track.type === 'video') {
        videoWrapper.style.display = 'block';
        centerControls.style.display = 'none';
        video.src = track.src;
        video.load();
        attach(video);
      } else {
        videoWrapper.style.display = 'none';
        centerControls.style.display = 'flex';
        let streamUrl = currentMode === 'radios' ? (track.urls ? track.urls[currentUrlIndex] : '') : track.src;
        streamStatusText.textContent = track.title;

        if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }

        if (streamUrl && streamUrl.includes('.m3u8')) {
          if (Hls.isSupported()) {
            hlsInstance = new Hls();
            hlsInstance.loadSource(streamUrl);
            hlsInstance.attachMedia(audio);
            hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => playTrack());
          } else {
            audio.src = streamUrl;
            audio.load();
            attach(audio);
          }
        } else {
          audio.src = streamUrl;
          audio.load();
          attach(audio);
        }
      }

      trackTitle.textContent = track.title;
      trackArtist.textContent = track.artist || 'Audio HD';
      setupMediaSession(track);
      updateActiveTrackStyle();
    }

    function renderPlaylist() {
      playlistContainer.innerHTML = '';
      const visibleList = getFilteredPlaylist();
      playlistCount.textContent = `${visibleList.length} ${currentMode === 'local' ? 'archivos' : 'emisoras'}`;

      if (visibleList.length === 0) {
        playlistContainer.innerHTML = `<div class="text-center py-8 text-zinc-500 text-[11px]">No hay elementos disponibles.</div>`;
        return;
      }

      const fragment = document.createDocumentFragment();
      const activeList = getActivePlaylist();

      visibleList.forEach((track) => {
        const realIndex = activeList.findIndex(t => t.id === track.id);
        const isCurrent = track.id === activeTrackId;
        const card = document.createElement('div');
        
        card.setAttribute('data-id', track.id);
        card.setAttribute('data-index', realIndex);

        card.className = `playlist-item flex items-center justify-between p-2 rounded-lg border transition-colors duration-150 cursor-pointer shrink-0 ${
          isCurrent ? 'border-purple-600 bg-zinc-900 text-white' : 'bg-black/60 hover:bg-zinc-900/60 text-slate-300 border-zinc-900'
        }`;

        const iconType = currentMode === 'local' && track.type === 'video' ? 'film' : 'music';

        card.innerHTML = `
          <div class="flex items-center gap-2 overflow-hidden">
            <div class="w-7 h-7 rounded-md ${isCurrent ? 'bg-purple-600 text-white' : 'bg-zinc-900 text-slate-400'} flex items-center justify-center text-xs shrink-0">
              <i data-lucide="${isCurrent && isPlaying ? 'volume-2' : iconType}" class="w-3.5 h-3.5"></i>
            </div>
            <div class="truncate">
              <h3 class="font-bold text-[11px] truncate ${isCurrent ? 'text-white' : 'text-slate-200'}">${track.title}</h3>
              <p class="text-[9px] text-slate-400 truncate">${track.artist}</p>
            </div>
          </div>
          <span class="text-[9px] px-1.5 py-0.5 rounded border border-zinc-800 bg-zinc-900 text-purple-400">${track.genre}</span>
        `;

        card.addEventListener('click', () => {
          if (activeTrackId !== track.id || !isPlaying) {
            loadTrack(realIndex);
            playTrack();
          } else {
            togglePlay();
          }
        });

        fragment.appendChild(card);
      });

      playlistContainer.appendChild(fragment);
      lucide.createIcons();
    }

    function updateActiveTrackStyle() {
      Array.from(playlistContainer.children).forEach((child) => {
        const id = child.getAttribute('data-id');
        const isCurrent = id === activeTrackId;
        child.className = `playlist-item flex items-center justify-between p-2 rounded-lg border transition-colors duration-150 cursor-pointer shrink-0 ${
          isCurrent ? 'border-purple-600 bg-zinc-900 text-white' : 'bg-black/60 hover:bg-zinc-900/60 text-slate-300 border-zinc-900'
        }`;
      });
    }

    function togglePlay() {
      if (isPlaying) pauseTrack();
      else playTrack();
    }

    function playTrack() {
      const activeMedia = getActiveMedia();
      attach(activeMedia);
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

      activeMedia.play().then(() => {
        isPlaying = true;
        playIcon.setAttribute('data-lucide', 'pause');
        playingBadge.style.opacity = '1';
        requestWakeLock();
        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
        lucide.createIcons();
        updateActiveTrackStyle();
      }).catch(err => {});
    }

    function pauseTrack() {
      audio.pause();
      video.pause();
      isPlaying = false;
      playIcon.setAttribute('data-lucide', 'play');
      playingBadge.style.opacity = '0';
      releaseWakeLock();
      if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
      lucide.createIcons();
      updateActiveTrackStyle();
    }

    btnPlay.addEventListener('click', togglePlay);
    
    btnPrev.addEventListener('click', () => {
      const list = getActivePlaylist();
      if (list.length === 0) return;
      currentTrackIndex = (currentTrackIndex - 1 + list.length) % list.length;
      loadTrack(currentTrackIndex);
      playTrack();
    });

    btnNext.addEventListener('click', () => {
      const list = getActivePlaylist();
      if (list.length === 0) return;
      currentTrackIndex = isShuffleActive ? Math.floor(Math.random() * list.length) : (currentTrackIndex + 1) % list.length;
      loadTrack(currentTrackIndex);
      playTrack();
    });

    audio.addEventListener('ended', () => { if (isRepeatActive) playTrack(); else btnNext.click(); });
    video.addEventListener('ended', () => { if (isRepeatActive) playTrack(); else btnNext.click(); });

    audio.addEventListener('timeupdate', () => {
      if (currentMode !== 'radios' && audio.duration) {
        progressBar.value = (audio.currentTime / audio.duration) * 100;
        currentTimeEl.textContent = `${Math.floor(audio.currentTime / 60)}:${Math.floor(audio.currentTime % 60).toString().padStart(2, '0')}`;
        totalDurationEl.textContent = `${Math.floor(audio.duration / 60)}:${Math.floor(audio.duration % 60).toString().padStart(2, '0')}`;
      }
    });

    progressBar.addEventListener('input', () => {
      if (currentMode === 'local' && getActivePlaylist().length > 0) {
        const activeMedia = getActiveMedia();
        activeMedia.currentTime = (progressBar.value / 100) * activeMedia.duration;
      }
    });

    volumeBar.addEventListener('input', () => {
      audio.volume = volumeBar.value / 100;
      video.volume = volumeBar.value / 100;
    });

    // CARGA DE ARCHIVOS LOCALES OPTIMIZADA CON ANIMACIÓN
    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      loadingScreen.classList.remove('hidden');

      setTimeout(() => {
        const previousLength = localPlaylist.length;
        const now = Date.now();
        let batch = [];

        files.forEach((file, idx) => {
          const isVideo = file.type.startsWith('video/') || /\.(mp4|webm|ogg|mov|mkv)$/i.test(file.name);
          const ext = file.name.split('.').pop().toUpperCase();
          let folderGenre = ext;
          if (file.webkitRelativePath && file.webkitRelativePath.includes('/')) {
            folderGenre = file.webkitRelativePath.split('/')[0];
          }

          batch.push({
            id: now + idx,
            title: file.name.replace(/\.[^/.]+$/, ""),
            artist: isVideo ? "Video HD Local" : `Audio ${ext} HD`,
            genre: isVideo ? "Video" : folderGenre,
            type: isVideo ? "video" : "audio",
            src: URL.createObjectURL(file)
          });
        });

        localPlaylist = localPlaylist.concat(batch);
        if (currentMode === 'local') {
          updateGenreFilterUI();
          renderPlaylist();
        }

        if (!isPlaying && previousLength === 0 && currentMode === 'local') {
          loadTrack(0);
        }

        loadingScreen.classList.add('hidden');
      }, 300);
    });

    loadRadiosJson();
    renderPlaylist();
  </script>
</body>
